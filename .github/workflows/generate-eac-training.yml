name: Generate EAC synthetic training set

on:
  push:
    branches: [eac-training-inference-20260808]
    paths: [".github/workflows/generate-eac-training.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  EAC_TARGET: "500"
  EAC_BATCH_SIZE: "20"
  EAC_REQUEST_INTERVAL_MS: "4500"
  EAC_OUTPUT_DIR: "generated/eac-v0.1"

jobs:
  generate:
    name: Remote-model EAC generation
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Restore generator and validator
        env:
          GENERATOR_GZIP_BASE64: ""
          VALIDATOR_GZIP_BASE64: ""
        run: |
          mkdir -p eac-training
          python - <<'PY'
          import os, base64, gzip
          for env, path in [
              ('GENERATOR_GZIP_BASE64', 'eac-training/generate.mjs'),
              ('VALIDATOR_GZIP_BASE64', 'eac-training/validate.mjs'),
          ]:
              data = gzip.decompress(base64.b64decode(os.environ[env]))
              open(path, 'wb').write(data)
          PY
          node --check eac-training/generate.mjs
          node --check eac-training/validate.mjs

      - name: Record VM environment
        run: |
          mkdir -p generated/eac-v0.1/provenance
          {
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "runner_name=$RUNNER_NAME"
            echo "repository=$GITHUB_REPOSITORY"
            echo "workflow=$GITHUB_WORKFLOW"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "event=$GITHUB_EVENT_NAME"
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "node=$(node --version)"
            echo "kernel=$(uname -a)"
          } > generated/eac-v0.1/provenance/runner-environment.txt

      - name: Generate 500 EAC examples through remote inference
        run: node eac-training/generate.mjs

      - name: Independently validate dataset
        run: node eac-training/validate.mjs generated/eac-v0.1 | tee generated/eac-v0.1/validation-result.json

      - name: Package dataset
        run: |
          cd generated
          tar -czf eac-synthetic-starter-500.tar.gz eac-v0.1
          sha256sum eac-synthetic-starter-500.tar.gz > eac-synthetic-starter-500.tar.gz.sha256

      - name: Upload dataset and inference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eac-synthetic-starter-500-${{ github.run_id }}
          path: |
            generated/eac-v0.1/
            generated/eac-synthetic-starter-500.tar.gz
            generated/eac-synthetic-starter-500.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Commit validated dataset and generator
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eac-training generated/eac-v0.1 generated/eac-synthetic-starter-500.tar.gz generated/eac-synthetic-starter-500.tar.gz.sha256
          git commit -m "Generate 500 EAC examples via remote model inference" || exit 0
          git push origin HEAD:eac-training-inference-20260808
